name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        # Added libtool, autoconf, and glib as per official source install docs
        sudo apt-get install -y build-essential pkg-config libtool autoconf \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libxml2-dev libglib2.0-dev freeglut3-dev libglew-dev zip

    - name: Cache libMLV
      id: cache-mlv
      uses: actions/cache@v4
      with:
        path: mlv-source
        key: ${{ runner.os }}-mlv-3.1.0

    - name: Download and Build libMLV
      if: steps.cache-mlv.outputs.cache-hit != 'true'
      run: |
        # Using a very common User-Agent to prevent the server from blocking the download
        curl -A "Mozilla/5.0 (X11; Linux x86_64)" -L "http://www-igm.univ-mlv.fr/~boussica/mlv/api/French/html/archives/mlv-3.1.0.tar.gz" -o mlv.tar.gz
        
        # Security check: if the file is just an HTML error page, stop here
        if ! file mlv.tar.gz | grep -q "gzip compressed data"; then
          echo "SERVER ERROR: The download failed. The server likely blocked the GitHub runner."
          cat mlv.tar.gz
          exit 1
        fi

        mkdir mlv-source
        tar -xzf mlv.tar.gz -C mlv-source --strip-components=1
        cd mlv-source
        # --prefix=/usr is recommended in the docs to avoid path issues
        ./configure --prefix=/usr
        make -j$(nproc)

    - name: Install libMLV
      run: |
        cd mlv-source
        sudo make install
        sudo ldconfig

    - name: Compile C Project
      run: |
        mkdir -p build
        make

    - name: Package Binary
      run: |
        zip -j medifrance_linux.zip build/medifrance

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        files: medifrance_linux.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}