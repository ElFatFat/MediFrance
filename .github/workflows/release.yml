name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      # These are fast and managed by apt, so we don't cache these.
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libxml2-dev freeglut3-dev libglew-dev

    - name: Cache libMLV
      id: cache-mlv
      uses: actions/cache@v4
      with:
        path: mlv-3.1.0
        key: ${{ runner.os }}-mlv-3.1.0

    - name: Download and Build libMLV
      if: steps.cache-mlv.outputs.cache-hit != 'true'
      run: |
        # Use -L to follow redirects and -O to ensure the filename is correct
        curl -L http://www-igm.univ-mlv.fr/~boussica/mlv/api/French/html/archives/mlv-3.1.0.tar.gz -o mlv-3.1.0.tar.gz
        tar -xzf mlv-3.1.0.tar.gz
        cd mlv-3.1.0
        ./configure
        make

    - name: Install libMLV
      run: |
        # Added a safety check: only enter the dir if it exists
        if [ -d "mlv-3.1.0" ]; then
          cd mlv-3.1.0
          sudo make install
          sudo ldconfig
        else
          echo "libMLV directory not found. Installation failed."
          exit 1
        fi

    - name: Compile C Project
      run: |
        # Ensure zip is present and run make
        sudo apt-get install -y zip
        make

    - name: Package Binary
      # -j (junk paths) stores the file without the 'build/' folder structure inside the zip
      run: |
        zip -j medifrance_linux.zip build/medifrance

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        # Point to the new zip file
        files: medifrance_linux.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}