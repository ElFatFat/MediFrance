name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install SDL 1.2 Dependencies
      run: |
        sudo apt-get update
        # Install SDL 1.2 libraries as specified in MLV documentation
        sudo apt-get install -y libsdl-gfx1.2-dev libsdl1.2-dev libsdl-mixer1.2-dev
        sudo apt-get install -y libsdl-ttf2.0-dev libglib2.0-dev libxml2-dev
        sudo apt-get install -y libsdl-image1.2-dev
        # Install build tools
        sudo apt-get install -y build-essential zip

    - name: Install libMLV from .deb packages
      run: |
        # Verify the .deb files exist
        if [ ! -f libs/libmlv0_2.0.2-1_amd64.deb ]; then
          echo "ERROR: libmlv0_2.0.2-1_amd64.deb not found in libs/"
          exit 1
        fi
        
        if [ ! -f libs/libmlv0-dev_2.0.2-1_amd64.deb ]; then
          echo "ERROR: libmlv0-dev_2.0.2-1_amd64.deb not found in libs/"
          exit 1
        fi
        
        # Install the .deb packages
        echo "Installing libMLV packages..."
        sudo dpkg -i libs/libmlv0_2.0.2-1_amd64.deb libs/libmlv0-dev_2.0.2-1_amd64.deb
        
        # Update library cache
        sudo ldconfig
        
        # Verify installation
        echo "Verifying libMLV installation..."
        if ldconfig -p | grep -q MLV; then
          echo "✓ libMLV successfully installed"
          ldconfig -p | grep MLV
        else
          echo "⚠ Warning: libMLV not found in ldconfig cache"
        fi

    - name: Compile C Project
      run: |
        echo "Compiling project..."
        mkdir -p build
        make
        
        # Verify binary was created
        if [ ! -f build/medifrance ]; then
          echo "ERROR: Binary not found at build/medifrance"
          echo "Build directory contents:"
          ls -la build/ || echo "build/ directory doesn't exist"
          exit 1
        fi
        
        echo "✓ Compilation successful"
        ls -lh build/medifrance
        file build/medifrance

    - name: Package Binary
      run: |
        echo "Creating release package..."
        
        # Create release directory
        mkdir -p release-package
        cp build/medifrance release-package/
        
        # Copy README if it exists
        if [ -f README.md ]; then
          cp README.md release-package/
        fi
        
        # Create the zip file
        cd release-package
        zip -r ../medifrance_linux.zip .
        cd ..
        
        # Verify package
        echo "✓ Package created successfully"
        ls -lh medifrance_linux.zip
        echo "Package contents:"
        unzip -l medifrance_linux.zip

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        files: medifrance_linux.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}