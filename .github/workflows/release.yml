name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        # Install build tools and libMLV dependencies (SDL 1.2, NOT SDL 2)
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          libtool \
          autoconf \
          make \
          gcc \
          doxygen \
          libsdl1.2-dev \
          libsdl-gfx1.2-dev \
          libsdl-mixer1.2-dev \
          libsdl-ttf2.0-dev \
          libsdl-image1.2-dev \
          libxml2-dev \
          libglib2.0-dev \
          zip

    - name: Cache libMLV
      id: cache-mlv
      uses: actions/cache@v4
      with:
        path: |
          mlv-source
          /usr/lib/libMLV*
          /usr/include/MLV
        # Use a more robust cache key that includes workflow hash
        key: ${{ runner.os }}-mlv-2.0.2-${{ hashFiles('.github/workflows/*.yml') }}
        restore-keys: |
          ${{ runner.os }}-mlv-2.0.2-

    - name: Download and Build libMLV
      if: steps.cache-mlv.outputs.cache-hit != 'true'
      run: |
        echo "Downloading libMLV 2.0.2 from GNU Savannah..."
        
        # Download with retry logic (3 attempts)
        for attempt in {1..3}; do
          echo "Attempt $attempt of 3..."
          
          # Use the official Savannah mirror that doesn't redirect
          if curl -A "Mozilla/5.0 (X11; Linux x86_64; rv:109.0) Gecko/20100101 Firefox/119.0" \
                  -L "https://download-mirror.savannah.gnu.org/releases/mlv/mlv-2.0.2.tar.gz" \
                  -o mlv.tar.gz \
                  --connect-timeout 30 \
                  --max-time 300 \
                  --fail; then
            echo "Download successful!"
            break
          else
            echo "Download failed. Retrying in 10 seconds..."
            sleep 10
            if [ $attempt -eq 3 ]; then
              echo "ERROR: Failed to download after 3 attempts"
              exit 1
            fi
          fi
        done
        
        # Verify the download is a valid gzip file
        if ! file mlv.tar.gz | grep -q "gzip compressed data"; then
          echo "ERROR: Downloaded file is not a valid gzip archive"
          echo "File type: $(file mlv.tar.gz)"
          echo "First 500 bytes:"
          head -c 500 mlv.tar.gz
          exit 1
        fi
        
        # Verify file size (mlv-2.0.2.tar.gz should be around 7MB)
        FILE_SIZE=$(stat -c%s mlv.tar.gz)
        echo "Downloaded file size: $FILE_SIZE bytes"
        if [ "$FILE_SIZE" -lt 5000000 ]; then
          echo "ERROR: File too small ($FILE_SIZE bytes). Expected ~7MB"
          exit 1
        fi

        # Extract the archive
        echo "Extracting archive..."
        mkdir -p mlv-source
        tar -xzf mlv.tar.gz -C mlv-source --strip-components=1
        
        # Build libMLV
        cd mlv-source
        echo "Configuring libMLV..."
        ./configure --prefix=/usr
        
        echo "Building libMLV with $(nproc) parallel jobs..."
        make -j$(nproc)

    - name: Install libMLV
      run: |
        cd mlv-source
        echo "Installing libMLV..."
        sudo make install
        sudo ldconfig
        
        # Verify installation
        echo "Verifying libMLV installation..."
        if ldconfig -p | grep -q MLV; then
          echo "✓ libMLV found in ldconfig cache"
          ldconfig -p | grep MLV
        else
          echo "⚠ Warning: libMLV not found in ldconfig cache"
        fi
        
        if ls /usr/lib/libMLV* >/dev/null 2>&1; then
          echo "✓ libMLV library files found:"
          ls -lh /usr/lib/libMLV*
        else
          echo "⚠ Warning: libMLV library files not found in /usr/lib"
        fi
        
        if [ -d /usr/include/MLV ]; then
          echo "✓ MLV headers found in /usr/include/MLV"
        else
          echo "⚠ Warning: MLV headers not found"
        fi

    - name: Compile C Project
      run: |
        echo "Compiling project..."
        mkdir -p build
        make
        
        # Verify binary was created
        if [ ! -f build/medifrance ]; then
          echo "ERROR: Binary not found at build/medifrance"
          echo "Build directory contents:"
          ls -la build/ || echo "build/ directory doesn't exist"
          exit 1
        fi
        
        echo "✓ Binary compiled successfully"
        ls -lh build/medifrance
        
        # Show binary info
        file build/medifrance
        ldd build/medifrance || echo "Note: ldd failed (might be expected for static builds)"

    - name: Package Binary
      run: |
        echo "Creating release package..."
        
        # Create a proper release structure
        mkdir -p release-package
        cp build/medifrance release-package/
        
        # Copy README if it exists
        if [ -f README.md ]; then
          cp README.md release-package/
        fi
        
        # Create the zip file
        cd release-package
        zip -r ../medifrance_linux_${{ github.ref_name }}.zip .
        cd ..
        
        # Verify package was created
        if [ ! -f medifrance_linux_${{ github.ref_name }}.zip ]; then
          echo "ERROR: Package not created"
          exit 1
        fi
        
        echo "✓ Package created successfully"
        ls -lh medifrance_linux_${{ github.ref_name }}.zip
        unzip -l medifrance_linux_${{ github.ref_name }}.zip

    - name: Generate Release Notes
      id: release_notes
      run: |
        # Create release notes
        cat > release_notes.md << 'EOF'
        ## Release ${{ github.ref_name }}
        
        ### Installation
        1. Download `medifrance_linux_${{ github.ref_name }}.zip`
        2. Extract the archive: `unzip medifrance_linux_${{ github.ref_name }}.zip`
        3. Make executable (if needed): `chmod +x medifrance`
        4. Run: `./medifrance`
        
        ### Requirements
        - Linux (tested on Ubuntu 24.04)
        - SDL 1.2 libraries (install with `sudo apt-get install libsdl1.2debian libsdl-gfx1.2-5 libsdl-mixer1.2 libsdl-ttf2.0-0 libsdl-image1.2`)
        
        ### Build Information
        - Built with: libMLV 2.0.2
        - Compiler: gcc
        - Build date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        EOF
        
        # Output for use in release
        echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
        cat release_notes.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: MediFrance ${{ github.ref_name }}
        body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
        files: medifrance_linux_${{ github.ref_name }}.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-artifacts-${{ github.ref_name }}
        path: |
          build/
          *.zip
        retention-days: 7